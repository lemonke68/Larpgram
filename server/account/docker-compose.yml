services:
  account:
    build: .
    container_name: larpgram-account
    # Не docker, а systemd (larpgram@<папка>.service из larpgram-infra) поднимает и перезапускает
    # сервис: так после этапа 6 он ждёт расшифрованный раздел.
    restart: "no"
    env_file: .env
    volumes:
      # Каталог проекта лежит на зашифрованном /srv/secure (этап 6 larpgram-infra).
      - ./data:/data
    networks:
      # web — для Traefik и для admin API MAS по имени контейнера; matrix-exim-relay — письма
      # через тот же релей, что и MAS.
      - web
      - matrix-exim-relay
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Как key-escrow: живём на хосте push под своим путём, priority выше host-only роутера sygnal.
      - "traefik.http.routers.larpgram-account.rule=Host(`push.mango-kokos.ru`) && PathPrefix(`/account`)"
      - "traefik.http.routers.larpgram-account.entrypoints=websecure"
      - "traefik.http.routers.larpgram-account.tls.certresolver=myresolver"
      - "traefik.http.routers.larpgram-account.priority=100"
      - "traefik.http.routers.larpgram-account.middlewares=larpgram-account-ratelimit,larpgram-account-stripprefix"
      # Лимит на IP: приложение делает единицы запросов на вход, перебор и спам кодами режем.
      - "traefik.http.middlewares.larpgram-account-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.larpgram-account-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.larpgram-account-ratelimit.ratelimit.burst=15"
      - "traefik.http.middlewares.larpgram-account-stripprefix.stripprefix.prefixes=/account"
      - "traefik.http.services.larpgram-account.loadbalancer.server.port=8080"

networks:
  web:
    external: true
  matrix-exim-relay:
    external: true
