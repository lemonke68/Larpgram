services:
  stickers:
    image: nginx:1-alpine
    # Не docker, а systemd (larpgram@<папка>.service из larpgram-infra) поднимает и перезапускает
    # сервис: так после этапа 6 он ждёт расшифрованный раздел.
    restart: "no"
    volumes:
      - /matrix/maunium/stickerpicker/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stickers.rule=Host(`stickers.mango-kokos.ru`)"
      - "traefik.http.routers.stickers.entrypoints=websecure"
      - "traefik.http.routers.stickers.tls.certresolver=myresolver"
      - "traefik.http.services.stickers.loadbalancer.server.port=80"

networks:
  web:
    external: true
