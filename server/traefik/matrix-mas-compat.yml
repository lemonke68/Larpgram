# Вход по паролю из приложения (Larpgram, 2026-10-01). Кладётся на сервер в
# /matrix/traefik/config/dynamic/ (root), Traefik подхватывает сам, перезапуск не нужен.
#
# Плейбук при matrix_playbook_reverse_proxy_type: none этих маршрутов не ставит, поэтому руками.
http:
  routers:
    # Matrix-запросы login / logout / refresh обслуживает MAS, а не Synapse (слой совместимости).
    # MAS живёт под /auth, поэтому префикс дописываем. Приоритет выше host-only роутера Synapse.
    matrix-mas-compat:
      rule: "Host(`matrix.mango-kokos.ru`) && PathPrefix(`/_matrix/client/{version:[^/]+}/{endpoint:login|logout|refresh}`)"
      entryPoints:
        - websecure
      service: matrix-mas-compat-svc
      middlewares:
        - matrix-mas-compat-add-prefix
      priority: 200
      tls:
        certResolver: myresolver

    # Admin API MAS нужен только сервису account внутри докер-сети. Снаружи — 403.
    matrix-mas-admin-api-deny:
      rule: "Host(`matrix.mango-kokos.ru`) && PathPrefix(`/auth/api/admin`)"
      entryPoints:
        - websecure
      service: matrix-mas-compat-svc
      middlewares:
        - matrix-mas-admin-api-local-only
      priority: 300
      tls:
        certResolver: myresolver

  middlewares:
    matrix-mas-compat-add-prefix:
      addPrefix:
        prefix: "/auth"
    matrix-mas-admin-api-local-only:
      ipWhiteList:
        sourceRange:
          - "127.0.0.1/32"

  services:
    matrix-mas-compat-svc:
      loadBalancer:
        servers:
          - url: "http://matrix-authentication-service:8080"
